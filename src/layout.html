<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  {{canonical}}
  {{verification}}
  <meta name="theme-color" content="#061A40">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Digifyhub">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  {{ogUrl}}
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Digifyhub — Dream Big. Start Smart. Grow Digitally.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  {{preload}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without blocking the first paint; system fonts show until they arrive. -->
  <link rel="preload" as="style" href="{{fontsUrl}}">
  <link rel="stylesheet" href="{{fontsUrl}}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{fontsUrl}}"></noscript>
  <link rel="stylesheet" href="assets/css/styles.css?v={{cssVersion}}">
  {{jsonLd}}
  {{analytics}}
</head>
<body class="{{bodyClass}}">
  {{bodyStart}}
  <a class="skip-link" href="#main">Skip to content</a>
  {{header}}
  <main id="main">
{{main}}
  </main>
  {{footer}}
  <a class="wa-float" href="{{whatsapp}}" target="_blank" rel="noopener" aria-label="Chat with Digifyhub on WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true">{{waIcon}}</svg>
  </a>
  <script src="assets/js/config.js?v={{configVersion}}" defer></script>
  <script src="assets/js/main.js?v={{jsVersion}}" defer></script>
</body>
</html>
